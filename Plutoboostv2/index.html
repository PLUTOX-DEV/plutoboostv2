    <!-- Preload critical assets to prevent blank page -->
    <link rel="preload" href="/pl.png" as="image" />
    
    <!-- Fallback styles in case JS fails to load -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        margin: 0;
        padding: 0;
        background: #0B0E2A;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .fallback-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        width: 100%;
        color: white;
        text-align: center;
        padding: 20px;
        background: linear-gradient(135deg, #0B0E2A 0%, #1a1040 100%);
      }
      
      .fallback-content {
        max-width: 500px;
        width: 100%;
      }
      
      .fallback-logo {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        background: linear-gradient(135deg, #7c3aed, #4f46e5);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        font-weight: bold;
        color: white;
        box-shadow: 0 0 40px rgba(124, 58, 237, 0.3);
        animation: pulse 2s ease-in-out infinite;
      }
      
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      
      .fallback-title {
        font-size: 32px;
        margin-bottom: 10px;
        background: linear-gradient(135deg, #a78bfa, #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      .fallback-subtitle {
        color: #94a3b8;
        margin-bottom: 20px;
        font-size: 16px;
      }
      
      .spinner {
        display: inline-block;
        width: 40px;
        height: 40px;
        border: 4px solid rgba(124, 58, 237, 0.2);
        border-radius: 50%;
        border-top-color: #7c3aed;
        animation: spin 0.8s ease-in-out infinite;
        margin: 20px auto 0;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      .fallback-error {
        display: none;
      }
      
      .fallback-error.show {
        display: block;
      }
      
      .fallback-error h2 {
        color: white;
        font-size: 24px;
        margin-bottom: 10px;
      }
      
      .fallback-error p {
        color: #94a3b8;
        margin-bottom: 20px;
      }
      
      .fallback-btn {
        background: linear-gradient(135deg, #7c3aed, #4f46e5);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 30px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 0 20px rgba(124, 58, 237, 0.3);
      }
      
      .fallback-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 30px rgba(124, 58, 237, 0.5);
      }
      
      .fallback-error-text {
        color: #64748b;
        margin-top: 15px;
        font-size: 12px;
        word-break: break-all;
      }
      
      @media (max-width: 640px) {
        .fallback-title {
          font-size: 24px;
        }
        .fallback-logo {
          width: 60px;
          height: 60px;
          font-size: 30px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5KQPQ5CM"
      height="0" width="0" style="display:none;visibility:hidden"></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->

    <!-- Fallback content that shows while React loads -->
    <div id="root-fallback" class="fallback-container">
      <div class="fallback-content">
        <div class="fallback-logo">P</div>
        <h1 class="fallback-title">Plutoboost</h1>
        <p class="fallback-subtitle">Loading your experience...</p>
        <div class="spinner"></div>
      </div>
    </div>

    <!-- React root -->
    <div id="root"></div>
    
    <!-- Error handling script -->
    <script>
      (function() {
        // Handle loading errors
        window.addEventListener('error', function(e) {
          console.error('Page load error:', e.message);
          const fallback = document.getElementById('root-fallback');
          if (fallback) {
            fallback.innerHTML = `
              <div class="fallback-content">
                <div style="font-size: 50px; margin-bottom: 20px;">😅</div>
                <h2 style="color: white; font-size: 24px; margin-bottom: 10px;">Something went wrong</h2>
                <p style="color: #94a3b8; margin-bottom: 20px;">Please try refreshing the page or clearing your browser cache.</p>
                <button onclick="location.reload()" class="fallback-btn">
                  Refresh Page
                </button>
                <p class="fallback-error-text">Error: ${e.message || 'Unknown error'}</p>
              </div>
            `;
          }
        });

        // Handle unhandled promise rejections
        window.addEventListener('unhandledrejection', function(e) {
          console.error('Unhandled rejection:', e.reason);
        });

        // Detect if React failed to mount
        setTimeout(function() {
          const root = document.getElementById('root');
          const fallback = document.getElementById('root-fallback');
          if (root && root.children.length === 0 && fallback) {
            // Show the fallback if React didn't mount
            fallback.style.display = 'flex';
          } else if (fallback) {
            fallback.style.display = 'none';
          }
        }, 5000);

        // Unregister old service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          }).catch(function(err) {
            console.log('Service worker unregister error:', err);
          });
        }

        // Clear old caches
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(key) {
              if (key.includes('plutoboost') || key.includes('vite') || key.includes('workbox')) {
                caches.delete(key).then(function() {
                  console.log('Cache deleted:', key);
                });
              }
            });
          }).catch(function(err) {
            console.log('Cache clear error:', err);
          });
        }
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
